<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyFlow - Panel gerencial</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#f1f5f9; --muted:#94a3b8;
          --accent:#6366f1; --ok:#10b981; --bad:#f43f5e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
           padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  .brand { font-weight:700; font-size:20px; }
  .brand small { display:block; font-weight:400; font-size:12px; color:var(--muted); }
  nav a { color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
  nav a.active { background:var(--accent); color:#fff; }
  main { max-width:900px; margin:0 auto; padding:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  h2 { margin:0 0 14px; font-size:17px; color:#a5b4fc; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:12px; align-items:end; }
  label { display:block; font-size:12px; color:var(--muted); font-weight:600; }
  input { width:100%; margin-top:4px; padding:9px 12px; background:var(--bg); color:var(--text);
          border:1px solid var(--line); border-radius:8px; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--ok); color:#fff;
           font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #result { margin-top:20px; padding:20px; background:var(--bg); border:1px solid var(--line);
            border-radius:10px; text-align:center; }
  .kpi { font-size:44px; font-weight:700; color:#a5b4fc; min-height:56px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .stat b { display:block; font-size:20px; }
  .muted { color:var(--muted); font-size:13px; }
  #msg { min-height:20px; margin:8px 0 0; font-size:14px; }
  #msg.error { color:var(--bad); }
  .bar { height:10px; background:var(--card); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:14px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .4s; }
</style>
</head>
<body>
<header>
  <div class="brand">✈ SkyFlow <small>Airlines Management</small></div>
  <nav><a href="/">Pasajeros</a><a class="active" href="/manager">Panel gerencial</a></nav>
</header>

<main>
  <section class="card">
    <h2>Ocupación por ruta y mes</h2>
    <div class="grid">
      <label>Ruta (ORIGEN-DESTINO)
        <input data-testid="manager-route" id="route" placeholder="BOG-MDE" autocomplete="off">
      </label>
      <label>Mes (YYYY-MM)
        <input data-testid="manager-month" id="month" placeholder="2024-04" autocomplete="off">
      </label>
      <button data-testid="manager-load" id="load" type="button">Consultar</button>
    </div>

    <div id="result">
      <div class="muted">Ocupación</div>
      <!-- Solo el porcentaje, p. ej. 78.43% -->
      <div class="kpi" data-testid="occupancy-value" id="occupancy"></div>
      <div class="bar"><div id="bar"></div></div>
      <div class="stats">
        <div class="stat"><span class="muted">Asientos vendidos</span><b id="sold">–</b></div>
        <div class="stat"><span class="muted">Capacidad total</span><b id="capacity">–</b></div>
      </div>
      <p id="msg" role="status">Escribe una ruta y un mes y pulsa «Consultar».</p>
    </div>
  </section>
</main>

<script>
  // Mismo origen que la API (FastAPI sirve esta pagina). Para otro host: window.API_BASE = "http://..."
  const API = window.API_BASE || "";
  const $ = (id) => document.getElementById(id);

  function reset(msg, isError) {
    $("occupancy").textContent = "";
    $("sold").textContent = "–";
    $("capacity").textContent = "–";
    $("bar").style.width = "0";
    const m = $("msg");
    m.textContent = msg || "";
    m.className = isError ? "error" : "";
  }

  async function loadOccupancy() {
    const route = $("route").value.trim();
    const month = $("month").value.trim();
    if (!route || !month) { reset("Completa la ruta y el mes.", true); return; }
    reset("Consultando Athena...", false);
    try {
      const res = await fetch(API + "/analytics/occupancy?route=" + encodeURIComponent(route) +
                              "&month=" + encodeURIComponent(month));
      if (res.status === 404) { reset("No hay datos para esa ruta y mes.", true); return; }
      if (res.status === 422) { reset("Formato inválido: usa AAA-BBB y AAAA-MM.", true); return; }
      if (!res.ok) { reset("Error al consultar (HTTP " + res.status + ").", true); return; }
      const data = await res.json();
      const pct = Number(data.occupancy) * 100;           // el contrato entrega 0..1
      $("occupancy").textContent = pct.toFixed(2) + "%";
      $("sold").textContent = Number(data.seats_sold).toLocaleString();
      $("capacity").textContent = Number(data.seats_capacity).toLocaleString();
      $("bar").style.width = Math.min(pct, 100) + "%";
      $("msg").textContent = data.route + " · " + data.month;
      $("msg").className = "";
    } catch (e) {
      reset("Error de conexión: " + e.message, true);
    }
  }

  $("load").addEventListener("click", loadOccupancy);
</script>
</body>
</html>
